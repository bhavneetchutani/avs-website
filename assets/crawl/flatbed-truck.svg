<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 960 252" fill="none" role="img" aria-labelledby="crawlTruckTitle crawlTruckDesc" style="overflow:visible">
  <title id="crawlTruckTitle">Structural steel, secured for the road.</title>
  <desc id="crawlTruckDesc">A blue conventional tractor pulls a low flatbed loaded with long steel I-beams. Three dark cargo restraints cross the steel, with small amber trailer markers and carefully drawn wheels.</desc>
  <defs>
    <linearGradient id="crawlTruckCab" x1="628" y1="32" x2="710" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2196E8"/><stop offset=".5" stop-color="#1272B8"/><stop offset="1" stop-color="#0E3454"/>
    </linearGradient>
    <linearGradient id="crawlTruckHood" x1="734" y1="99" x2="800" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1272B8"/><stop offset=".68" stop-color="#0C4B78"/><stop offset="1" stop-color="#0E3454"/>
    </linearGradient>
    <linearGradient id="crawlTruckMetal" x1="0" y1="105" x2="0" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#627D90"/><stop offset=".22" stop-color="#27485F"/><stop offset=".78" stop-color="#163043"/><stop offset="1" stop-color="#415C6D"/>
    </linearGradient>
    <linearGradient id="crawlTruckSteel" x1="40" y1="60" x2="515" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D586B"/><stop offset=".45" stop-color="#233F53"/><stop offset="1" stop-color="#172F42"/>
    </linearGradient>
    <linearGradient id="crawlTruckGlass" x1="658" y1="42" x2="705" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#254E6A"/><stop offset=".48" stop-color="#123149"/><stop offset="1" stop-color="#081523"/>
    </linearGradient>
    <linearGradient id="crawlTruckChrome" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1F3546"/><stop offset=".32" stop-color="#7D929F"/><stop offset=".5" stop-color="#B1BCC1"/><stop offset=".66" stop-color="#536A79"/><stop offset="1" stop-color="#172B3B"/>
    </linearGradient>
    <linearGradient id="crawlTruckBeamSoft" x1="838" y1="130" x2="1430" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2A93B" stop-opacity=".28"/><stop offset=".55" stop-color="#F2A93B" stop-opacity=".09"/><stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crawlTruckBeamCore" x1="838" y1="130" x2="1270" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1D8" stop-opacity=".45"/><stop offset="1" stop-color="#FFE7C2" stop-opacity="0"/>
    </linearGradient>
